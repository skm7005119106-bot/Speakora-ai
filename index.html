<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0A22">
<title>Speakora AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--mut:#d0c9f2;--vio:#6c4bff;--pink:#e04fb8;--blue:#2f6bff;--teal:#12b3a0;--gold:#e0ae2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:500 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(420px 320px at 95% 0,#5b2ee8aa,transparent),radial-gradient(380px 320px at 0 70%,#1e6bff66,transparent),#0d0a22;background-attachment:fixed}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:22px 18px 120px}
.g{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.21);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
header small{display:block;font-size:13px;color:var(--mut)}header b{font-size:24px;font-weight:800}header b span{color:#ff6fd0}
.seg{display:flex;padding:4px;border-radius:99px}.seg button{border:0;background:none;padding:10px 13px;border-radius:99px;font-size:13px;font-weight:700;min-height:44px}.seg button.on{background:var(--vio)}
.scr{display:none}.scr.on{display:block}
h2{font-size:24px;font-weight:800;line-height:1.2;margin:0 0 6px}p{margin:0}.mut{color:var(--mut);font-size:14px}
.card{border-radius:26px;padding:18px;margin-top:14px;box-shadow:0 12px 40px #3b1fbf44}
.hero{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#7c5cff,#ff5cc8);flex:none}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:56% 16%;display:block}
.btn{border:0;border-radius:99px;min-height:46px;padding:0 20px;font-weight:700;background:linear-gradient(90deg,var(--vio),var(--pink));display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}.btn.w{width:100%;margin-top:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;min-height:72px}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}.tile b{display:block;font-size:15px}.tile span span{font-size:13px;color:var(--mut)}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#4f8bff,#ff5cc8);transition:width .4s}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.pill{white-space:nowrap;border:0;border-radius:99px;padding:10px 14px;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:var(--mut);min-height:44px}.pill.on{background:linear-gradient(90deg,var(--vio),var(--pink));color:#fff}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sh h3{margin:0;font-size:18px}
.list{display:grid;gap:10px}.row{border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.row .n{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;flex:none}.row div{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{border-radius:20px;padding:14px 12px}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--mut)}
.pr{display:flex;align-items:center;gap:16px}.pring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}.pring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#1a1440}.pring b{position:relative;font-size:20px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:320px;border-radius:26px;margin-top:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.15)}.top .ring{width:46px;height:46px;padding:2px}.top b{display:block;font-size:15px}.top small{font-size:13px;color:#7de8bd}.top button{margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;white-space:pre-wrap}.m.ai{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-left-radius:5px}.m.me{align-self:flex-end;background:linear-gradient(120deg,#5a4bff,#c24fc0);border-bottom-right-radius:5px}
.comp{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.15);align-items:center}
.comp input{flex:1;min-width:0;min-height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);padding:0 16px;outline:none}
.rb{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.14);flex:none}.rb.mic{width:52px;height:52px;background:linear-gradient(135deg,var(--vio),var(--pink))}.rb.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff5cc8aa}100%{box-shadow:0 0 0 16px #ff5cc800}}
.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}.field input,.field select{width:100%;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);padding:0 14px;outline:none}.field option{background:#1a1440}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),480px);height:68px;border-radius:28px;display:flex;justify-content:space-around;align-items:center;z-index:20;background:rgba(40,30,90,.55)}
nav button{border:0;background:none;color:#cfc8f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;min-width:54px;min-height:48px}
nav button.on{color:#fff}nav .mid span{width:54px;height:54px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--vio),var(--pink));box-shadow:0 8px 24px #0006;color:#fff}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(13,10,34,.82);backdrop-filter:blur(10px)}.ov.on{display:flex}.box{width:min(440px,100%);max-height:92vh;overflow:auto;border-radius:28px;padding:22px;background:rgba(40,30,90,.7)}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.on{background:#ff6fd0;width:22px;border-radius:8px}
.opt{display:block;width:100%;text-align:left;border-radius:16px;padding:13px 16px;margin-top:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);min-height:48px}.opt.on{border-color:#ff6fd0;background:rgba(224,79,184,.22)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:60;background:#fff;color:#0d0a22;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;display:none;max-width:90%;text-align:center}
:focus-visible{outline:2px solid #ff6fd0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 8a5 5 0 0 1 0 8"/></symbol>
</defs></svg>

<div class="app">
<header>
 <div><small data-i="welcome"></small><b>Speakora <span>AI</span></b></div>
 <div class="seg g" id="seg"><button data-l="English">EN</button><button data-l="Hindi">हिं</button><button data-l="Bengali">বাং</button></div>
</header>

<section id="home" class="scr on">
 <div class="card g hero"><div class="ring"><img src="avatar.jpg" alt="AI tutor"></div><div><h2 id="heroT" style="font-size:20px"></h2><p class="mut" data-i="sub" style="margin:6px 0 12px"></p><button class="btn" onclick="go('speak');mic()"><svg class="i"><use href="#i-mic"/></svg><span data-i="start"></span></button></div></div>
 <div class="tiles">
  <button class="tile g" onclick="go('speak');$('chatInput').focus()"><span class="ic" style="background:var(--blue)"><svg class="i"><use href="#i-chat"/></svg></span><span><b data-i="chat"></b><span data-i="chatS"></span></span></button>
  <button class="tile g" onclick="go('speak');mic()"><span class="ic" style="background:var(--teal);color:#06231f"><svg class="i"><use href="#i-mic"/></svg></span><span><b data-i="speak"></b><span data-i="speakS"></span></span></button>
  <button class="tile g" onclick="go('learn')"><span class="ic" style="background:#d63fa6"><svg class="i"><use href="#i-book"/></svg></span><span><b data-i="learn"></b><span data-i="learnS"></span></span></button>
  <button class="tile g" onclick="go('progress')"><span class="ic" style="background:var(--gold);color:#1a1405"><svg class="i"><use href="#i-chart"/></svg></span><span><b data-i="improve"></b><span data-i="improveS"></span></span></button>
 </div>
 <div class="card g"><div style="display:flex;justify-content:space-between;font-weight:700"><span id="lvTitle"></span><span id="lvPct" class="mut"></span></div><div class="bar"><i id="lvBar"></i></div><div class="pills" id="homePills"></div></div>
 <div class="sh"><h3 data-i="cont"></h3></div><div class="list" id="contList"></div>
</section>

<section id="learn" class="scr">
 <h2 data-i="learn"></h2><p class="mut" data-i="learnH"></p>
 <div class="pills" id="pills" style="margin-top:14px"></div>
 <div class="card g pr"><div class="pring" id="lRing"><b id="lPct"></b></div><div style="flex:1"><b id="lName" style="font-size:17px"></b><p class="mut" id="lDesc"></p><div class="bar"><i id="lBar"></i></div></div></div>
 <div class="list" id="lessons" style="margin-top:14px"></div>
</section>

<section id="speak" class="scr">
 <div class="chat g">
  <div class="top"><div class="ring"><img src="avatar.jpg" alt="AI tutor"></div><div><b>Speakora Coach</b><small id="status"></small></div><button class="pill" id="vBtn" onclick="toggleVoice()" aria-label="Tutor voice"><svg class="i"><use href="#i-vol"/></svg></button><button class="pill" onclick="clearChat()" data-i="newChat"></button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="comp" id="form"><button type="button" class="rb mic" id="micBtn" onclick="mic()" aria-label="Speak"><svg class="i"><use href="#i-mic"/></svg></button><input id="chatInput" data-p="type" autocomplete="off"><button class="rb" type="submit" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button></form>
 </div>
 <div class="pills" style="margin-top:12px"><button class="pill" onclick="send('Help me introduce myself in English.')">Introduce myself</button><button class="pill" onclick="send('Start a job interview practice. Ask one question at a time.')">Interview</button><button class="pill" onclick="send('Start a restaurant role-play. You are the waiter.')">Role-play</button></div>
</section>

<section id="progress" class="scr">
 <h2 data-i="improve"></h2>
 <div class="card g pr"><div class="pring" id="oRing"><b id="oPct"></b></div><div style="flex:1"><b data-i="journey" style="font-size:17px"></b><div class="bar"><i id="oBar"></i></div></div></div>
 <div class="stats"><div class="stat g"><b id="sL">0</b><span data-i="done"></span></div><div class="stat g"><b id="sC">0</b><span data-i="chats"></span></div><div class="stat g"><b id="sS">0</b><span data-i="streak"></span></div></div>
 <div class="list" id="lvRows" style="margin-top:14px"></div>
</section>

<section id="profile" class="scr">
 <h2 data-i="profile"></h2>
 <div class="field"><label for="pName" data-i="name"></label><input id="pName" maxlength="40"></div>
 <div class="field"><label for="pLang" data-i="lang"></label><select id="pLang"><option value="English">English</option><option value="Hindi">हिन्दी</option><option value="Bengali">বাংলা</option></select></div>
 <div class="field"><label for="pLevel" data-i="level"></label><select id="pLevel"></select></div>
 <button class="btn w" onclick="saveProfile()" data-i="save"></button>
 <button class="btn sec w" onclick="resetAll()" data-i="reset"></button>
</section>
</div>

<nav class="g" aria-label="Main">
 <button data-s="home" onclick="go('home')"><svg class="i"><use href="#i-home"/></svg><span data-i="home"></span></button>
 <button data-s="learn" onclick="go('learn')"><svg class="i"><use href="#i-book"/></svg><span data-i="learn"></span></button>
 <button class="mid" data-s="speak" onclick="go('speak')"><span><svg class="i"><use href="#i-mic"/></svg></span><span data-i="speak" style="width:auto;height:auto;margin:0;background:none;box-shadow:none;font-size:12px"></span></button>
 <button data-s="progress" onclick="go('progress')"><svg class="i"><use href="#i-chart"/></svg><span data-i="improve"></span></button>
 <button data-s="profile" onclick="go('profile')"><svg class="i"><use href="#i-user"/></svg><span data-i="profile"></span></button>
</nav>
<div id="toast" role="status"></div>
<div class="ov" id="ob"><div class="box g" id="obBox"></div></div>
<div class="ov" id="lessonOv"><div class="box g" id="lessonBox"></div></div>

bn:{welcome:"আবার স্বাগতম",hero:"আজ কথা বলতে প্রস্তুত?",sub:"আপনার টিউটরের সাথে ৫ মিনিট অনুশীলন করুন।",start:"কথা শুরু করুন",chat:"চ্যাট",chatS:"লিখে শিখুন",speak:"বলুন",speakS:"কণ্ঠে কথা",learn:"শিখুন",learnS:"পাঠ",improve:"উন্নতি",improveS:"আপনার অগ্রগতি",home:"হোম",profile:"প্রোফাইল",cont:"শেখা চালিয়ে যান",learnH:"স্তর বেছে নিন, ধাপে ধাপে শিখুন।",newChat:"নতুন চ্যাট",type:"ইংরেজিতে উত্তর লিখুন…",hello:"নমস্কার! আমি আপনার ইংরেজি টিউটর। মাইক চাপুন বা লিখুন, আর জানান কী অনুশীলন করতে চান।",ready:"সাহায্যে প্রস্তুত",listening:"শুনছি…",thinking:"ভাবছি…",wake:"সার্ভার জাগছে। একটু অপেক্ষা করুন…",err:"টিউটরের সাথে যুক্ত হতে পারিনি। এক মিনিট পরে আবার চেষ্টা করুন।",noVoice:"কণ্ঠে বলতে Chrome লাগবে। আপনি লিখতে পারেন।",mic:"বলার জন্য মাইকের অনুমতি দিন।",journey:"আপনার শেখার যাত্রা",done:"সম্পূর্ণ পাঠ",chats:"টিউটর চ্যাট",streak:"টানা দিন",name:"আপনার নাম",lang:"ব্যাখ্যার ভাষা",level:"আপনার ইংরেজি স্তর",save:"সেভ করুন",reset:"অগ্রগতি রিসেট করুন",saved:"সেভ হয়েছে",lesson:"পাঠ",goal:"একটি সহজ উদাহরণ পড়ুন, তারপর নিজের বাক্য লিখুন।",ask:"টিউটরের সাথে অনুশীলন করুন",mark:"পাঠ সম্পূর্ণ করুন",close:"বন্ধ করুন",well:"পাঠ সম্পূর্ণ। চমৎকার!",next:"পরবর্তী",go:"শেখা শুরু করুন",o1:"আপনার ভাষা বেছে নিন",o1s:"কঠিন বিষয় আমরা এই ভাষায় বোঝাব।",o2:"আপনাকে কী নামে ডাকব?",o3:"আপনার ইংরেজি স্তর",lv:["আমি সবে শুরু করছি","আমি কিছু মৌলিক ইংরেজি জানি","আমি সহজ কথোপকথন চালাতে পারি","পরিচিত বিষয়ে কথা বলতে পারি","আমি আরও সাবলীল ইংরেজি চাই"],askRs:"এই ফোনের সব পাঠ ও চ্যাট রিসেট করবেন?"}};
const LN={English:"en",Hindi:"hi",Bengali:"bn"};
let S={name:"",language:"Hindi",level:"pre_a1",goal:"Everyday conversation",completed:[],chats:0,streak:0,lastPractice:"",onboarded:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("speakora_state")||"{}"))}catch(e){}
let cur=null,activeLevel=S.level,hist=[],busy=false,voiceOn=true,screen="home";
const t=k=>(T[LN[S.language]||"en"][k]??T.en[k]);
const save=()=>{try{localStorage.setItem("speakora_state",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lvName=id=>(LEVELS.find(l=>l.id===id)||LEVELS[0]).n;
const mods=id=>{if(cur&&cur.levels){const f=cur.levels.find(l=>l.id===id);if(f&&f.modules)return f.modules.map(m=>typeof m==="string"?m:m.title)}return MODS[id]};
const pctOf=id=>{const m=mods(id);return Math.round(m.filter((_,i)=>S.completed.includes(id+":"+i)).length/m.length*100)};
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display="none",2600)}
function today(d){return(d||new Date()).toLocaleDateString("en-CA")}
function touch(){const d=today();if(S.lastPractice!==d){S.streak=S.lastPractice===today(new Date(Date.now()-864e5))?S.streak+1:1;S.lastPractice=d}save()}

function go(id){screen=id;document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===id));renderAll();window.scrollTo(0,0)}
function applyLang(){
 document.documentElement.lang=LN[S.language];
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
 document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.language));
 $("status").textContent=t("ready");
 if(!hist.length)$("msgs").innerHTML="",addMsg(t("hello"),"ai");
 renderAll();if($("ob").classList.contains("on"))renderOb();
}
function pillsHtml(){return LEVELS.map(l=>`<button class="pill${l.id===activeLevel?" on":""}" data-lv="${l.id}">${l.n}</button>`).join("")}
function bindPills(el){el.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{activeLevel=b.dataset.lv;renderAll()})}
function renderAll(){
 const p=pctOf(S.level);
 $("heroT").textContent=t("hero")+(S.name?" "+S.name:"");
 $("lvTitle").textContent=lvName(S.level);$("lvPct").textContent=p+"%";$("lvBar").style.width=p+"%";
 $("homePills").innerHTML=pillsHtml();bindPills($("homePills"));
 const m=mods(S.level),nx=Math.max(0,m.findIndex((_,i)=>!S.completed.includes(S.level+":"+i)));
 $("contList").innerHTML=`<button class="row g" onclick="activeLevel='${S.level}';openLesson(${nx})"><span class="n">${nx+1}</span><div><b>${esc(m[nx])}</b><small>${lvName(S.level)}</small></div></button>`;
 $("pills").innerHTML=pillsHtml();bindPills($("pills"));
 const lp=pctOf(activeLevel),L=LEVELS.find(l=>l.id===activeLevel);
 $("lPct").textContent=lp+"%";$("lRing").style.background=`conic-gradient(#8f6bff ${lp*3.6}deg,rgba(255,255,255,.15) 0)`;$("lName").textContent=L.n;$("lDesc").textContent=L.d;$("lBar").style.width=lp+"%";
 $("lessons").innerHTML=mods(activeLevel).map((x,i)=>{const d=S.completed.includes(activeLevel+":"+i);return`<button class="row g" onclick="openLesson(${i})"><span class="n">${d?"✓":i+1}</span><div><b>${esc(x)}</b><small>${t("lesson")} ${i+1}</small></div></button>`}).join("");
 const all=LEVELS.reduce((a,l)=>a+mods(l.id).length,0),op=Math.min(100,Math.round(S.completed.length/all*100));
 $("oPct").textContent=op+"%";$("oRing").style.background=`conic-gradient(#8f6bff ${op*3.6}deg,rgba(255,255,255,.15) 0)`;$("oBar").style.width=op+"%";
 $("sL").textContent=S.completed.length;$("sC").textContent=S.chats;$("sS").textContent=S.streak;
 $("lvRows").innerHTML=LEVELS.map(l=>`<div class="row g"><div><b>${l.n}</b><div class="bar"><i style="width:${pctOf(l.id)}%"></i></div></div><small>${pctOf(l.id)}%</small></div>`).join("");
 $("pName").value=S.name;$("pLang").value=S.language;$("pLevel").innerHTML=LEVELS.map(l=>`<option value="${l.id}">${l.n}</option>`).join("");$("pLevel").value=S.level;
}
function openLesson(i){
 const title=mods(activeLevel)[i];
 $("lessonBox").innerHTML=`<small class="mut">${t("lesson")} ${i+1} · ${lvName(activeLevel)}</small><h2 style="margin-top:6px">${esc(title)}</h2><p class="mut">${t("goal")}</p><div class="field"><input id="lAns" maxlength="200" placeholder="…"></div><button class="btn w" id="lAsk">${t("ask")}</button><button class="btn sec w" id="lDone">${t("mark")}</button><button class="btn sec w" id="lClose">${t("close")}</button>`;
 $("lessonOv").classList.add("on");
 $("lAsk").onclick=()=>{const a=$("lAns").value.trim();$("lessonOv").classList.remove("on");go("speak");send(a?`Help me practise this sentence for the lesson "${title}": "${a}". Correct me gently.`:`Teach me "${title}" at ${lvName(activeLevel)} level. Explain in ${S.language} and ask me one practice question.`)};
 $("lDone").onclick=()=>{const k=activeLevel+":"+i;if(!S.completed.includes(k))S.completed.push(k);touch();$("lessonOv").classList.remove("on");renderAll();toast(t("well"))};
 $("lClose").onclick=()=>$("lessonOv").classList.remove("on");
}

/* ---------- chat + voice ---------- */
function addMsg(x,who){const e=document.createElement("div");e.className="m "+who;e.textContent=x;$("msgs").appendChild(e);$("msgs").scrollTop=1e9;return e}
async function send(text){
 text=(text||"").trim();if(!text||busy)return;
 if(screen!=="speak")go("speak");
 busy=true;addMsg(text,"me");$("chatInput").value="";
 const ld=addMsg(t("thinking"),"ai"),wake=setTimeout(()=>ld.textContent=t("wake"),8000),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),75000);
 const recent=hist.slice(-8);
 const ctx=`Learner level: ${lvName(S.level)}. Explain difficult points in ${S.language}. Goal: ${S.goal}. You are Speakora AI, a kind English speaking coach. Keep replies short (max 4 sentences), ask one question at a time, and gently correct mistakes with a natural version.`+(recent.length?"\nConversation so far:\n"+recent.map(m=>(m.role==="user"?"Learner: ":"Tutor: ")+m.content).join("\n"):"");
 try{
  const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({message:text,language:S.language,level:S.level,goal:S.goal,context:ctx,history:recent})});
  const d=await r.json();if(!r.ok||!d.reply)throw 0;
  ld.textContent=d.reply;hist.push({role:"user",content:text},{role:"assistant",content:d.reply});S.chats++;touch();renderAll();speak(d.reply);
 }catch(e){ld.textContent=t("err")}
 clearTimeout(wake);clearTimeout(to);busy=false;$("msgs").scrollTop=1e9;
}
function speak(x){
 if(!voiceOn||!("speechSynthesis" in window))return;speechSynthesis.cancel();
 (x.replace(/[*_#`]/g,"").match(/[^.!?।]+[.!?।]*/g)||[x]).forEach(s=>{if(!s.trim())return;const u=new SpeechSynthesisUtterance(s);u.lang=/[\u0980-\u09FF]/.test(s)?"bn-IN":/[\u0900-\u097F]/.test(s)?"hi-IN":"en-IN";u.rate=.95;speechSynthesis.speak(u)})
}
function toggleVoice(){voiceOn=!voiceOn;$("vBtn").style.opacity=voiceOn?1:.4;if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false;
function mic(){
 if(!SR){toast(t("noVoice"));return}
 if(on){rec.stop();return}
 if(window.speechSynthesis)speechSynthesis.cancel();
 rec=new SR();rec.lang="en-IN";rec.interimResults=true;rec.continuous=false;
 rec.onstart=()=>{on=true;$("micBtn").classList.add("on");$("status").textContent=t("listening")};
 rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;$("chatInput").value=s;if(e.results[e.results.length-1].isFinal)send(s)};
 rec.onerror=e=>{if(e.error==="not-allowed")toast(t("mic"))};
 rec.onend=()=>{on=false;$("micBtn").classList.remove("on");$("status").textContent=t("ready")};
 rec.start();
}
function clearChat(){hist=[];if(window.speechSynthesis)speechSynthesis.cancel();$("msgs").innerHTML="";addMsg(t("hello"),"ai")}
$("form").addEventListener("submit",e=>{e.preventDefault();send($("chatInput").value)});

/* ---------- profile + onboarding ---------- */
function saveProfile(){S.name=$("pName").value.trim();S.language=$("pLang").value;S.level=$("pLevel").value;activeLevel=S.level;save();applyLang();toast(t("saved"))}
function resetAll(){if(!confirm(t("askRs")))return;S.completed=[];S.chats=0;S.streak=0;S.lastPractice="";save();clearChat();renderAll()}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{S.language=b.dataset.l;save();applyLang()});
let step=0;
function renderOb(){
 const dots=`<div class="dots">${[0,1,2].map(i=>`<i class="${i===step?"on":""}"></i>`).join("")}</div>`;
 const head=`<div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div class="ring" style="width:64px;height:64px"><img src="avatar.jpg" alt=""></div><div><b>Speakora AI</b><p class="mut">Speak · Practice · Improve</p></div></div>`;
 let h="";
 if(step===0)h=`<h2>${t("o1")}</h2><p class="mut">${t("o1s")}</p>`+[["English","English"],["Hindi","हिन्दी"],["Bengali","বাংলা"]].map(([v,n])=>`<button class="opt${S.language===v?" on":""}" onclick="S.language='${v}';applyLang()">${n}</button>`).join("");
 if(step===1)h=`<h2>${t("o2")}</h2><div class="field"><input id="oName" maxlength="40" value="${esc(S.name)}" placeholder="${t("name")}"></div>`;
 if(step===2)h=`<h2>${t("o3")}</h2>`+LEVELS.map((l,i)=>`<button class="opt${S.level===l.id?" on":""}" onclick="S.level='${l.id}';activeLevel='${l.id}';renderOb()">${t("lv")[i]}</button>`).join("");
 $("obBox").innerHTML=dots+head+h+`<button class="btn w" onclick="obNext()">${step===2?t("go"):t("next")}</button>`;
}
function obNext(){
 if(step===1)S.name=($("oName").value||"").trim();
 if(step<2){step++;renderOb();return}
 S.onboarded=true;save();$("ob").classList.remove("on");applyLang();go("home");
}
fetch("./Speakora_AI_Learning_Curriculum.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j){cur=j;renderAll()}}).catch(()=>{});
document.querySelector('nav [data-s="home"]').classList.add("on");
applyLang();
if(!S.onboarded){renderOb();$("ob").classList.add("on")}
</script>
</body>
</html>
